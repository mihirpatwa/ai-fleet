# Bring the fleet online 24/7:
#   cp deploy/.env.example deploy/.env   # set ANTHROPIC_API_KEY
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# State lives in the ${HOME}/.aifleet volume, so `docker compose restart`
# preserves tasks, events, memories and the audit log. (${HOME} is used
# rather than the literal `~`, which Compose does not expand in volume paths.)
services:
  aifleet:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    volumes:
      - ${HOME}/.aifleet:/data
      - ${PROJECT_PATH:-./workspace}:/workspace
      - ${HOME}/.claude:/root/.claude
    ports:
      - '7878:7878'
      - '3737:3737'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:7878/healthz || exit 1']
      interval: 30s
      start_period: 10s
      timeout: 5s
      retries: 5
