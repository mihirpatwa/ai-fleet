# dashboard/ is the Antd app (phase 11–14 rebuild). dashboard-legacy/ is the
# retired shadcn app, kept in git for one release — intentionally NOT a
# workspace package so it isn't installed/built.
packages:
  - daemon
  - dashboard
  - cli
allowBuilds:
  better-sqlite3: true
  esbuild: true
  msw: false
  sharp: false
  unrs-resolver: true
